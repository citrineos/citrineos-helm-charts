apiVersion: v1
kind: Service
metadata:
  name: {{ include "citrineos-operator-ui.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "citrineos-operator-ui.name" . }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "citrineos-operator-ui.name" . }}
  ports:
    - name: rest
      port: {{ .Values.service.ports.rest.port }}
      targetPort: rest
    - name: prometheus
      port: {{ .Values.service.ports.prometheus.port }}
      targetPort: prometheus
