{{- $rollout := .Values.rollout.enabled }}
{{- if $rollout }}
# Progressive delivery via Argo Rollouts. Basic (traffic-router-less) canary:
# the Service selector is left untouched, so canary and stable pods both sit
# behind it. Each setWeight step is approximated by replica counts; a pause 
# step is a bake window during which the rollout can be aborted, after which
# it auto-promotes.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "citrineos-ocpi.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "citrineos-ocpi.name" . }}
    {{- include "citrineos-ocpi.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "citrineos-ocpi.name" . }}
      {{- include "citrineos-ocpi.selectorLabels" . | nindent 6 }}
  # Honoured by both Deployment and Rollout.
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds | default 600 }}
  # Old ReplicaSets kept as rollback targets (Rollout revisions / Deployment history).
  revisionHistoryLimit: {{ .Values.rollout.revisionHistoryLimit | default 10 }}
  strategy:
  {{- if $rollout }}
    canary:
      maxSurge: {{ .Values.rollout.maxSurge | default 1 }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable | default 0 }}
      {{- if .Values.rollout.analysis.metrics }}
      # Background checks on the canary pods, from startingStep until promotion.
      analysis:
        startingStep: {{ .Values.rollout.analysis.startingStep | default 1 }}
        templates:
          - templateName: {{ include "citrineos-ocpi.fullname" . }}-live
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      {{- end }}
      steps:
        {{- range $step := .Values.rollout.steps }}
        {{- if hasKey $step "weight" }}
        - setWeight: {{ $step.weight }}
        {{- end }}
        {{- if hasKey $step "pause" }}
        - pause: {{ if $step.pause }}{ duration: {{ $step.pause | quote }} }{{ else }}{}{{ end }}
        {{- end }}
        {{- end }}
        {{- if .Values.rollout.gate.metrics }}
        # Must pass before the final swap to 100%.
        - analysis:
            templates:
              - templateName: {{ include "citrineos-ocpi.fullname" . }}-gate
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        {{- end }}
  {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ include "citrineos-ocpi.name" . }}
        {{- include "citrineos-ocpi.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "citrineos-ocpi.serviceAccountName" . }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "citrineos-ocpi.name" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: rest
              containerPort: {{ .Values.service.ports.rest.port }}
            - name: prometheus
              containerPort: {{ .Values.service.ports.prometheus.port }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.envFromSecretKeys }}
            - name: {{ .envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.lifecycle.preStopSleepSeconds }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ . }}"]
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: rest
            periodSeconds: {{ .Values.probes.startup.periodSeconds | default 5 }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold | default 60 }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds | default 5 }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: rest
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: rest
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
