{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "citrineos-ocpi.serviceAccountName" . }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ include "citrineos-ocpi.name" . }}
    {{- include "citrineos-ocpi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{ nindent 0 "\n" }}
{{- if .Values.rbac.create -}}
{{- range $infraNamespace := .Values.rbac.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "citrineos-ocpi.fullname" $ }}-infra-access
  namespace: {{ $infraNamespace }}
  labels:
    {{- include "citrineos-ocpi.labels" $ | nindent 4 }}
rules:
  {{- toYaml $.Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "citrineos-ocpi.fullname" $ }}-infra-access
  namespace: {{ $infraNamespace }}
  labels:
    {{- include "citrineos-ocpi.labels" $ | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "citrineos-ocpi.serviceAccountName" $ }}
  namespace: {{ $.Values.namespace }}
roleRef:
  kind: Role
  name: {{ include "citrineos-ocpi.fullname" $ }}-infra-access
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}