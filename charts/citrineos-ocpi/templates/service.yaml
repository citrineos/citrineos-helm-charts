apiVersion: v1
kind: Service
metadata:
  name: {{ include "citrineos-ocpi.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "citrineos-ocpi.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "citrineos-ocpi.name" . }}
  ports:
    - name: rest
      port: {{ .Values.service.ports.rest.port }}
      targetPort: rest
    - name: prometheus
      port: {{ .Values.service.ports.prometheus.port }}
      targetPort: prometheus
