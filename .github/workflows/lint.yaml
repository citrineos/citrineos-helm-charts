name: lint
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4
      - name: Add dependency chart repos
        run: helm repo add haproxytech https://haproxytech.github.io/helm-charts
      - name: Lint and render every chart
        run: |
          for c in charts/*/; do
            helm dependency build "$c"
            helm lint "$c"
            helm template ci "$c" > /dev/null
          done
      - name: Changed charts bump their version
        run: scripts/check-version-bump.sh "origin/${{ github.base_ref }}"
